[project]
name = "studyflow-course"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp>=1.20,<2", "fastembed>=0.6,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
studyflow = "studyflow.cli:main"
studyflow-vault = "harness.vault_server:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studyflow*", "harness*"]
